<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabajos de Juanma — AWEB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .contenedor {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #1e293b, #1d4ed8);
      padding: 28px 32px;
      border-radius: 14px;
      margin-bottom: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    header h1 {
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 6px;
    }

    header p {
      color: #cbd5e1;
      font-size: 0.98rem;
    }

    .lista-trabajos {
      list-style: none;
      display: grid;
      gap: 14px;
    }

    .tarjeta-enlace {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      background-color: #1e293b;
      color: #f8fafc;
      padding: 18px 22px;
      border-radius: 12px;
      border: 1px solid #334155;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .tarjeta-enlace:hover {
      transform: translateY(-2px);
      border-color: #60a5fa;
      background-color: #243247;
    }

    .titulo-trabajo {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .etiqueta-ruta {
      font-size: 0.85rem;
      color: #93c5fd;
      background-color: rgba(59, 130, 246, 0.15);
      padding: 5px 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <header>
      <h1>Mis trabajos de AWEB</h1>
      <p>Juan Manuel Cano García — Portada de prácticas en GitHub Pages</p>
    </header>

    <ul class="lista-trabajos">
      <li>
        <a class="tarjeta-enlace" href="ejercicio1-Texto%20y%20etiquetas%20CSS/index.html">
          <span class="titulo-trabajo">Práctica 1 — Texto y etiquetas CSS</span>
        </a>
      </li>
      <li>
        <a class="tarjeta-enlace" href="ejercicio2-curriculum/index.html">
          <span class="titulo-trabajo">Práctica 2 — Lista, div y class e id</span>
        </a>
      </li>
      <li>
        <a class="tarjeta-enlace" href="ejercicio3-Enlaces%2C%20menu%20y%20clases%20CSS/principal.html">
          <span class="titulo-trabajo">Práctica 3 — Enlaces, menu y clases CSS</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
